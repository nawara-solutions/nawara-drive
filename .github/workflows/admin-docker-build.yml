name: Admin Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-docker-build.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-drive-admin

jobs:
  build-develop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/admin
          build-args: |
            BUILD_CONFIGURATION=development
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/admin
          build-args: |
            BUILD_CONFIGURATION=production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:latest
