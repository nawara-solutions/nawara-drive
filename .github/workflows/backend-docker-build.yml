name: Backend Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-docker-build.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-drive-backend

jobs:
  build-develop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:latest

  # Deploys :production to the same VPS as admin, over SSH, routed through the existing
  # Traefik proxy on the deploy_edge network. Reuses admin's DEPLOY_SSH_* repo secrets — no
  # new secrets needed. See apps/backend/README.md's Deployment section.
  deploy-production:
    needs: build-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_NAME
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE_NAME:production"
            docker stop nawara-drive-backend 2>/dev/null || true
            docker rm nawara-drive-backend 2>/dev/null || true
            docker run -d --name nawara-drive-backend --restart unless-stopped \
              --network deploy_edge \
              --label traefik.enable=true \
              --label traefik.http.routers.nawara-drive-backend.rule=Host\(\`drive-api.hsalem-anwar.dev\`\) \
              --label traefik.http.routers.nawara-drive-backend.entrypoints=websecure \
              --label traefik.http.routers.nawara-drive-backend.tls.certresolver=le \
              --label traefik.http.services.nawara-drive-backend.loadbalancer.server.port=3000 \
              "$IMAGE_NAME:production"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
